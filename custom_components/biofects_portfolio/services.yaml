biofects_portfolio:
  name: Biofects Portfolio Tracker
  description: Manage your investment portfolio holdings
  services:
    add_holding:
      name: Add Holding
      description: Add a new stock or crypto holding to your portfolio
      fields:
        symbol:
          name: Symbol
          description: Stock ticker or crypto symbol (e.g., AAPL, BTC)
          required: true
          example: "AAPL"
          selector:
            text:
        holding_type:
          name: Type
          description: Type of holding
          required: true
          selector:
            select:
              options:
                - "stock"
                - "crypto"
        quantity:
          name: Quantity
          description: Number of shares or coins
          required: true
          example: 10
          selector:
            number:
              min: 0
              step: 0.00000001
              mode: box
        buy_price:
          name: Buy Price
          description: Purchase price per unit (or total investment if using total_investment mode)
          required: true
          example: 150.00
          selector:
            number:
              min: 0
              step: 0.01
              mode: box
        total_invested:
          name: Total Invested (Optional - Universal)
          description: Total USD amount paid for stocks or crypto. When provided with quantity, buy_price will be automatically calculated (total_invested ÷ quantity = buy_price). Works for both stocks and crypto.
          required: false
          example: 1400.00
          selector:
            number:
              min: 0
              step: 0.01
              mode: box
        total_cost:
          name: Total Cost (Optional - Legacy)
          description: Legacy parameter - use total_invested instead.
          required: false
          example: 1400.00
          selector:
            number:
              min: 0
              step: 0.01
              mode: box
    
    remove_holding:
      name: Remove Holding
      description: Remove a holding or specific lot from your portfolio. Provide entity_id for specific lot, symbol for all lots, or lot_id for advanced use.
      fields:
        symbol:
          name: Symbol
          description: Remove ALL lots of this symbol (e.g., AAPL, XRP). Use this to exit a position completely.
          required: false
          example: "XRP"
          selector:
            text:
        entity_id:
          name: Entity ID
          description: Remove a specific lot by entity ID (e.g., sensor.holding_xrp_0). Most precise method.
          required: false
          example: "sensor.holding_xrp_0"
          selector:
            entity:
              domain: sensor
        lot_id:
          name: Lot ID
          description: Remove by lot ID (advanced, visible in sensor attributes)
          required: false
          example: "XRP_1699564321_5678"
          selector:
            text:
    
    update_holding:
      name: Update Holding
      description: Update quantity or buy price of an existing holding
      fields:
        symbol:
          name: Symbol
          description: Symbol of the holding to update
          required: true
          example: "AAPL"
          selector:
            text:
        quantity:
          name: Quantity
          description: New quantity (leave empty to keep current)
          required: false
          example: 10
          selector:
            number:
              min: 0
              step: 0.00000001
              mode: box
        buy_price:
          name: Buy Price
          description: New buy price (leave empty to keep current)
          required: false
          example: 150.00
          selector:
            number:
              min: 0
              step: 0.01
              mode: box
