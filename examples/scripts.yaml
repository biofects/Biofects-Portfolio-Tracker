# Example Scripts for Portfolio Management

# Refresh Portfolio Data
refresh_portfolio:
  alias: "Refresh Portfolio Data"
  description: "Manually trigger portfolio data update"
  sequence:
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.portfolio_summary
    - service: notify.persistent_notification
      data:
        title: "Portfolio Refreshed"
        message: "Portfolio data has been updated."

# Add New Stock Holding
add_stock_holding:
  alias: "Add Stock Holding"
  description: "Add a new stock to portfolio"
  fields:
    symbol:
      description: "Stock ticker symbol"
      example: "AAPL"
    quantity:
      description: "Number of shares"
      example: 10
    buy_price:
      description: "Purchase price per share"
      example: 150.00
  sequence:
    - service: biofects_portfolio.add_holding
      data:
        symbol: "{{ symbol }}"
        holding_type: "stock"
        quantity: "{{ quantity }}"
        buy_price: "{{ buy_price }}"
    - service: notify.persistent_notification
      data:
        title: "Holding Added"
        message: "{{ symbol }}: {{ quantity }} shares at ${{ buy_price }}"

# Add New Crypto Holding
add_crypto_holding:
  alias: "Add Crypto Holding"
  description: "Add a new cryptocurrency to portfolio"
  fields:
    symbol:
      description: "Crypto symbol"
      example: "BTC"
    quantity:
      description: "Amount of crypto"
      example: 0.5
    buy_price:
      description: "Purchase price per unit"
      example: 30000.00
  sequence:
    - service: biofects_portfolio.add_holding
      data:
        symbol: "{{ symbol }}"
        holding_type: "crypto"
        quantity: "{{ quantity }}"
        buy_price: "{{ buy_price }}"
    - service: notify.persistent_notification
      data:
        title: "Crypto Holding Added"
        message: "{{ symbol }}: {{ quantity }} at ${{ buy_price }}"

# Remove Holding
remove_holding:
  alias: "Remove Holding"
  description: "Remove a holding from portfolio"
  fields:
    symbol:
      description: "Symbol to remove"
      example: "AAPL"
  sequence:
    - service: biofects_portfolio.remove_holding
      data:
        symbol: "{{ symbol }}"
    - service: notify.persistent_notification
      data:
        title: "Holding Removed"
        message: "{{ symbol }} has been removed from your portfolio"

# Update Holding Quantity
update_holding_quantity:
  alias: "Update Holding Quantity"
  description: "Update quantity of an existing holding"
  fields:
    symbol:
      description: "Symbol to update"
      example: "AAPL"
    quantity:
      description: "New quantity"
      example: 15
  sequence:
    - service: biofects_portfolio.update_holding
      data:
        symbol: "{{ symbol }}"
        quantity: "{{ quantity }}"
    - service: notify.persistent_notification
      data:
        title: "Holding Updated"
        message: "{{ symbol }} quantity updated to {{ quantity }}"

# Portfolio Performance Report
generate_portfolio_report:
  alias: "Generate Portfolio Report"
  description: "Create a detailed portfolio report"
  sequence:
    - service: notify.mobile_app_your_phone
      data:
        title: "📊 Portfolio Performance Report"
        message: >
          Generated: {{ now().strftime('%Y-%m-%d %H:%M') }}
          
          ═══════════════════════
          PORTFOLIO SUMMARY
          ═══════════════════════
          
          💰 Total Value: ${{ states('sensor.portfolio_summary') | round(2) }}
          💵 Cost Basis: ${{ state_attr('sensor.portfolio_summary', 'total_cost') | round(2) }}
          📈 Gain/Loss: ${{ state_attr('sensor.portfolio_summary', 'total_gain_loss') | round(2) }}
          📊 Performance: {{ state_attr('sensor.portfolio_summary', 'total_gain_loss_percent') | round(2) }}%
          
          ═══════════════════════
          HOLDINGS BREAKDOWN
          ═══════════════════════
          
          📈 Stocks: {{ state_attr('sensor.portfolio_summary', 'stock_count') }}
          💎 Crypto: {{ state_attr('sensor.portfolio_summary', 'crypto_count') }}
          📊 Total: {{ state_attr('sensor.portfolio_summary', 'total_holdings') }}
          
          Last Updated: {{ state_attr('sensor.portfolio_summary', 'last_updated') }}

# Emergency Portfolio Alert
emergency_portfolio_check:
  alias: "Emergency Portfolio Check"
  description: "Immediate portfolio status check and alert"
  sequence:
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.portfolio_summary
    - delay:
        seconds: 2
    - service: notify.mobile_app_your_phone
      data:
        title: "🚨 Emergency Portfolio Check"
        message: >
          Current Status:
          Value: ${{ states('sensor.portfolio_summary') | round(2) }}
          P/L: {{ state_attr('sensor.portfolio_summary', 'total_gain_loss_percent') | round(2) }}%
        data:
          importance: high
          ttl: 0
          priority: high
