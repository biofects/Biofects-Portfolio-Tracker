# Advanced Portfolio Dashboard
# Complete dashboard with charts, statistics, and news
# Requires: ApexCharts Card, Mushroom Cards, Auto Entities

views:
  - title: Portfolio
    path: portfolio
    icon: mdi:wallet
    badges: []
    cards:
      # Header Section
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: 💼 Investment Portfolio
            subtitle: Real-time tracking with Biofects Portfolio Tracker
            
      # Main Metrics Row
      - type: horizontal-stack
        cards:
          # Total Value
          - type: custom:mushroom-template-card
            primary: Portfolio Value
            secondary: ${{ states('sensor.portfolio_summary') | round(2) }}
            icon: mdi:wallet
            icon_color: blue
            layout: vertical
            
          # Performance
          - type: custom:mushroom-template-card
            primary: Performance
            secondary: >
              {{ state_attr('sensor.portfolio_summary', 'total_gain_loss_percent') | round(2) }}%
            icon: >
              {% if state_attr('sensor.portfolio_summary', 'total_gain_loss') | float > 0 %}
                mdi:trending-up
              {% else %}
                mdi:trending-down
              {% endif %}
            icon_color: >
              {% if state_attr('sensor.portfolio_summary', 'total_gain_loss') | float > 0 %}
                green
              {% else %}
                red
              {% endif %}
            layout: vertical
            
          # Gain/Loss
          - type: custom:mushroom-template-card
            primary: Gain/Loss
            secondary: >
              ${{ state_attr('sensor.portfolio_summary', 'total_gain_loss') | round(2) }}
            icon: mdi:cash
            icon_color: >
              {% if state_attr('sensor.portfolio_summary', 'total_gain_loss') | float > 0 %}
                green
              {% else %}
                red
              {% endif %}
            layout: vertical
            
      # Holdings Breakdown
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Stocks
            secondary: "{{ state_attr('sensor.portfolio_summary', 'stock_count') }} positions"
            icon: mdi:chart-line
            icon_color: amber
            layout: vertical
            
          - type: custom:mushroom-template-card
            primary: Crypto
            secondary: "{{ state_attr('sensor.portfolio_summary', 'crypto_count') }} positions"
            icon: mdi:currency-btc
            icon_color: orange
            layout: vertical
            
      # Performance Chart
      - type: custom:apexcharts-card
        header:
          show: true
          title: 7-Day Portfolio Performance
          show_states: true
        graph_span: 7d
        span:
          start: day
        update_interval: 10min
        all_series_config:
          stroke_width: 3
          type: line
          curve: smooth
        series:
          - entity: sensor.portfolio_summary
            name: Portfolio Value
            color: '#2196F3'
            show:
              in_header: true
              
      # Detailed Holdings (Auto-generated)
      - type: custom:auto-entities
        card:
          type: entities
          title: 📊 Holdings Details
          show_header_toggle: false
        filter:
          include:
            - entity_id: sensor.holding_*
              options:
                type: custom:multiple-entity-row
                name: attribute
                attribute: symbol
                secondary_info:
                  entity: this.entity_id
                  attribute: gain_loss_percent
                  name: false
                  format: precision2
                  suffix: '%'
                entities:
                  - entity: this.entity_id
                    attribute: current_price
                    name: Price
                    format: precision2
                  - entity: this.entity_id
                    attribute: quantity
                    name: Qty
                  - entity: this.entity_id
                    attribute: total_value
                    name: Value
                    format: precision2
        sort:
          method: attribute
          attribute: total_value
          reverse: true
          
      # Individual Holdings Performance
      - type: custom:apexcharts-card
        header:
          show: true
          title: Holdings Performance (24h)
        graph_span: 24h
        series:
          # Add your holdings here
          - entity: sensor.holding_aapl
            name: AAPL
            color: '#A2AAAD'
          - entity: sensor.holding_tsla
            name: TSLA
            color: '#E82127'
          - entity: sensor.holding_btc
            name: BTC
            color: '#F7931A'
          - entity: sensor.holding_eth
            name: ETH
            color: '#627EEA'
            
      # News Ticker
      - type: markdown
        title: 📰 Latest Market News
        content: >
          {% set news = state_attr('sensor.portfolio_news', 'news_items') %}
          {% if news %}
            {% for item in news[:5] %}
              **[{{ item.title }}]({{ item.link }})**
              
              *{{ item.published }}*
              
              {{ item.summary[:200] }}...
              
              ---
              
            {% endfor %}
          {% else %}
            No news available at this time.
          {% endif %}
          
      # Quick Actions (Service Calls)
      - type: entities
        title: ⚙️ Quick Actions
        entities:
          - type: button
            name: Refresh Portfolio Data
            icon: mdi:refresh
            action_name: Refresh
            tap_action:
              action: call-service
              service: homeassistant.update_entity
              service_data:
                entity_id: sensor.portfolio_summary
